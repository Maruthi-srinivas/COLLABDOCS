# Development overrides. Use with the base file:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  web:
    volumes:
      - ./services/web:/app
      - web_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  mailpit:
    ports:
      - "8025:8025"

  minio:
    ports:
      - "9001:9001"
