global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080", "api-b:8080"]
  - job_name: collab
    metrics_path: /metrics
    static_configs:
      - targets: ["collab:8081", "collab-b:8081"]
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8082", "worker-b:8082"]
  - job_name: compactor
    metrics_path: /metrics
    static_configs:
      - targets: ["compactor:8083"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
