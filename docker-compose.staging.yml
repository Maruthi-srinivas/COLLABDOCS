# Staging overlay. Development credentials stay in docker-compose.yml.
# docker compose --env-file .env -f docker-compose.yml -f docker-compose.staging.yml up -d --build

volumes:
  wal:

services:
  postgres:
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /wal && chown postgres:postgres /wal && exec docker-entrypoint.sh postgres -c archive_mode=on -c wal_level=replica -c archive_timeout=60 -c \"archive_command=test ! -f /wal/%f && cp %p /wal/%f\""]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - wal:/wal
    mem_limit: 4g
    cpus: "2"

  redis:
    mem_limit: 512m
    cpus: "0.25"

  roles:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - ./docker/postgres/roles.sh:/roles.sh:ro
    entrypoint: ["/bin/sh", "/roles.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [collabdocs]
    restart: "no"

  migrate:
    command: ["-url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}", "-user=collabdocs_migrator", "-password=${MIGRATOR_DB_PASSWORD}", "-locations=filesystem:/flyway/sql", "-connectRetries=40", "migrate"]
    depends_on:
      roles:
        condition: service_completed_successfully

  grants:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - ./docker/postgres/grants.sh:/grants.sh:ro
    entrypoint: ["/bin/sh", "/grants.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [collabdocs]
    restart: "no"

  api:
    image: ${API_IMAGE:-collabdocs-api:latest}
    environment:
      SPRING_DATASOURCE_USERNAME: collabdocs_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      grants:
        condition: service_completed_successfully
    mem_limit: 1g
    cpus: "1"

  api-b:
    image: ${API_IMAGE:-collabdocs-api:latest}
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: collabdocs_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM}
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: collabdocs
      APP_PUBLIC_URL: http://localhost:8080
      COMPACTOR_URL: http://compactor:8083
    depends_on:
      grants:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 1g
    cpus: "1"
    networks: [collabdocs]
    restart: unless-stopped

  collab:
    environment:
      SPRING_DATASOURCE_USERNAME: collabdocs_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
    mem_limit: 2g
    cpus: "1"

  collab-b:
    environment:
      SPRING_DATASOURCE_USERNAME: collabdocs_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
    mem_limit: 2g
    cpus: "1"

  worker:
    environment:
      SPRING_DATASOURCE_USERNAME: collabdocs_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
      WORKER_NAME: worker-1
      CLAMAV_ENABLED: "true"
      CLAMAV_HOST: clamav
    depends_on:
      clamav:
        condition: service_healthy
    mem_limit: 1536m
    cpus: "1"

  worker-b:
    image: collabdocs-worker:latest
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    environment:
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: collabdocs_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: collabdocs
      COMPACTOR_URL: http://compactor:8083
      WORKER_NAME: worker-2
      CLAMAV_ENABLED: "true"
      CLAMAV_HOST: clamav
    depends_on:
      grants:
        condition: service_completed_successfully
      compactor:
        condition: service_started
      clamav:
        condition: service_healthy
    mem_limit: 1536m
    cpus: "1"
    networks: [collabdocs]
    restart: unless-stopped

  compactor:
    environment:
      POSTGRES_USER: collabdocs_app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
    mem_limit: 512m
    cpus: "0.5"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile

  nginx:
    volumes:
      - ./docker/nginx/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - api-b
      - collab
      - collab-b
      - web

  clamav:
    image: clamav/clamav:1.4
    networks: [collabdocs]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 180s

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEY: ${BACKUP_KEY}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - wal:/wal:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [collabdocs]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks: [collabdocs]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [collabdocs]
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    networks: [collabdocs]
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: redis://redis:6379
    networks: [collabdocs]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    volumes:
      - /:/host:ro
    command: ["--path.rootfs=/host"]
    networks: [collabdocs]
    restart: unless-stopped
