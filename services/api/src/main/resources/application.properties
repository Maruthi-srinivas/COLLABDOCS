spring.application.name=collabdocs-api
server.port=${SERVER_PORT:8080}
spring.datasource.hikari.connection-timeout=3000
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB
spring.mail.host=${MAIL_HOST:mailpit}
spring.mail.port=${MAIL_PORT:1025}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.flyway.enabled=false
collabdocs.jwt.private-key=${JWT_PRIVATE_KEY_PEM:}
collabdocs.jwt.public-key=${JWT_PUBLIC_KEY_PEM:}
collabdocs.cookie.secure=${COOKIE_SECURE:false}
collabdocs.app-public-url=${APP_PUBLIC_URL:http://localhost:8080}
collabdocs.admin-implicit-access=${WORKSPACE_ADMIN_IMPLICIT_ACCESS:true}
collabdocs.mail-from=${MAIL_FROM:collabdocs@localhost}
collabdocs.compactor-url=${COMPACTOR_URL:http://compactor:8083}
collabdocs.internal-token=${INTERNAL_TOKEN:change-me-internal}
collabdocs.minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
collabdocs.minio.access-key=${MINIO_ACCESS_KEY:collabdocs}
collabdocs.minio.secret-key=${MINIO_SECRET_KEY:change-me-minio}
collabdocs.minio.bucket=${MINIO_BUCKET:collabdocs}
